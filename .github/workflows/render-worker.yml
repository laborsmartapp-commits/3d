# Copy this file to .github/workflows/render-worker.yml in the GitHub repository
# (the Base44 sync is not allowed to write GitHub Actions workflows itself).
name: Build render worker image

on:
  push:
    branches: [main]
    paths: ['render-worker/**', '.github/workflows/render-worker.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: render-worker
          platforms: linux/amd64
          load: true
          tags: krush-render-worker:test
      # No GPU on GitHub runners: proves image, Chromium, Three.js and FFmpeg on CPU WebGL.
      - name: Smoke test (software WebGL)
        run: docker run --rm -e ALLOW_SOFTWARE_GL=1 krush-render-worker:test python3 tests/smoke_test.py
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: render-worker
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/krush-render-worker:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/krush-render-worker:latest
      - name: Image reference
        run: |
          echo "### Render worker image" >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/${{ github.repository_owner }}/krush-render-worker@${{ steps.push.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
