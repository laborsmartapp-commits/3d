<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>html,body{margin:0;background:#000;overflow:hidden}</style>
  <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.171.0/build/three.module.js" } }</script>
</head>
<body>
<script type="module">
  // Minimal Three.js scene using the same window.__krushRender contract as the Krush Studio /render page.
  import * as THREE from 'three';
  try {
    const W = innerWidth, H = innerHeight, fps = 30, cfg = window.__KRUSH_RENDER || {};
    const r = new THREE.WebGLRenderer({ antialias: true });
    r.setSize(W, H); r.shadowMap.enabled = true; document.body.appendChild(r.domElement);
    const scene = new THREE.Scene(); scene.background = new THREE.Color('#0b1026');
    const cam = new THREE.PerspectiveCamera(50, W / H, 0.1, 100); cam.position.set(4, 3, 6); cam.lookAt(0, 0.5, 0);
    const sun = new THREE.DirectionalLight('#fff1dc', 3); sun.position.set(5, 8, 3); sun.castShadow = true;
    scene.add(sun, new THREE.HemisphereLight('#7dd3fc', '#3b1d5e', 0.6));
    const cube = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), new THREE.MeshStandardMaterial({ color: '#05ce91', roughness: 0.3, metalness: 0.4 }));
    cube.castShadow = true; cube.position.y = 1; scene.add(cube);
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: '#1e1b2e' }));
    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
    const gl = r.getContext(), ext = gl.getExtension('WEBGL_debug_renderer_info');
    window.__krushRender = {
      frames: Math.round((cfg.seconds || 3) * fps), fps, width: W, height: H, stage: 'smoke-test', actors: ['cube'],
      gl: ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
      frame(i) { const t = i / fps; cube.rotation.set(t * 0.7, t * 1.3, 0); cube.position.y = 1 + Math.sin(t * 3) * 0.3; r.render(scene, cam); return t; },
    };
  } catch (e) { window.__krushRenderError = e.message; }
</script>
</body>
</html>
